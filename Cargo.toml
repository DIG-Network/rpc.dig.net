[package]
name = "rpc-dig-net"
version = "0.2.3"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "rpc.dig.net — the public DIG Network read gateway: a strict allowlist wrapper in front of a real public dig-node."
repository = "https://github.com/DIG-Network/rpc.dig.net"
publish = false

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"
required-features = ["server"]

[features]
# The pure gate/tier logic builds with no features and no I/O — that is what the test suite
# and any consumer needs. `server` adds the axum runtime for the deployed binary.
default = []
server = ["dep:axum", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:hyper", "dep:hyper-util", "dep:tower-service", "dep:tokio", "dep:reqwest", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = { version = "0.7", optional = true }
# Origin TLS (#1951): axum::serve has no TLS, so the accept loop is hand-wired over tokio-rustls +
# hyper-util rather than pulling axum-server, whose tls-rustls feature depends on `rustls-pemfile`
# (unmaintained, RUSTSEC-2025-0134) — the same crate dig-relay's tls.rs deliberately avoids. PEM
# parsing therefore uses rustls-pki-types' own PemObject trait, matching that decision.
# rustls with ring only, never OpenSSL, matching the rest of the peer stack.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pki-types = { version = "1", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"], optional = true }
tower-service = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
serde_json = "1"
# Drive the router as a tower Service so the HTTP boundary itself is under test, not just the
# pure gate function.
tower = { version = "0.5", features = ["util"] }
# Self-signed pairs for the origin-TLS tests, so cert handling is proven rather than assumed.
rcgen = "0.14"
tempfile = "3"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
