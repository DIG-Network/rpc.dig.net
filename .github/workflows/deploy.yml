# Deploy on tag. Builds the gateway for aarch64, publishes it as a release asset, then applies
# terraform with that asset's URL + SHA-256 pinned in.
#
# The host verifies the checksum before installing (infra/user_data.sh.tftpl). That is not
# ceremony: this box is internet-facing on two peer ports, so "curl a binary and run it" is not an
# acceptable install path.
#
# ONE WRITER. This workflow is the only thing that applies this stack — see dig_ecosystem#1938,
# where two pipelines deploying one service silently undid each other for twelve minor versions.
# Nothing else may touch these resources, and no setting may be changed in the console.
#
# Third-party actions are pinned to a full commit SHA (a mutable tag could be re-pointed).

name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # publish the release asset
  id-token: write # OIDC into the deploy role

concurrency:
  group: deploy-rpc-dig-net
  cancel-in-progress: false

jobs:
  deploy:
    name: build + apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      # The node host is Graviton (arm64); cross-link with the aarch64 GNU toolchain.
      - name: install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: build gateway (aarch64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --features server --bin gateway --target aarch64-unknown-linux-gnu

      # Rename the artifact to its published name BEFORE uploading. `gh release upload path#label`
      # sets the display LABEL and keeps the file's basename as the asset name, so uploading
      # `.../release/gateway#rpc-gateway-aarch64` publishes an asset literally called `gateway` —
      # and the download URL terraform bakes into user_data then 404s on the host, long after the
      # deploy reported the upload as successful.
      - name: stage + checksum the artifact
        id: art
        run: |
          set -euo pipefail
          cp target/aarch64-unknown-linux-gnu/release/gateway rpc-gateway-aarch64
          SHA="$(sha256sum rpc-gateway-aarch64 | cut -d' ' -f1)"
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
          echo "gateway sha256=$SHA"

      - name: publish the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ vars.DIG_NODE_VERSION }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes

          # dig-origin-cert.sh ships as an asset rather than inside user_data, because EC2 caps
          # user data at 16 KiB and the helper plus its comments does not fit — see the size
          # precondition in infra/node.tf. It is fetched and SHA-256-verified on the host by the
          # same install_verified the two binaries go through.
          gh release upload "$TAG" rpc-gateway-aarch64 infra/dig-origin-cert.sh --clobber

          # Confirm each asset resolves at the EXACT url user_data will curl, BEFORE terraform runs.
          # An upload that "succeeded" under the wrong name is otherwise invisible until the host
          # 404s at boot — and by then the instance has already been replaced. Failing here costs a
          # workflow run; failing there costs the origin.
          for ASSET in rpc-gateway-aarch64 dig-origin-cert.sh; do
            URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"
            curl -fsSL -o /dev/null "$URL"
            echo "asset reachable at $URL"
          done

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: terraform init
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=rpc.dig.net/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: terraform apply
        env:
          TAG: ${{ vars.DIG_NODE_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          terraform -chdir=infra apply -auto-approve -input=false \
            -var="gateway_artifact_url=$BASE/rpc-gateway-aarch64" \
            -var="gateway_sha256=${{ steps.art.outputs.sha }}" \
            -var="origin_cert_script_url=$BASE/dig-origin-cert.sh" \
            -var="dig_node_version=${{ vars.DIG_NODE_VERSION }}" \
            -var="dig_node_artifact_url=${{ vars.DIG_NODE_ARTIFACT_URL }}" \
            -var="dig_node_sha256=${{ vars.DIG_NODE_SHA256 }}"

      # Apply the freshly-built gateway IN PLACE. Terraform no longer replaces the instance on a
      # user_data (SHA) change (infra/node.tf), so the apply above did not put the new binary on the
      # host — this does, over SSM, checksum-verified, with a rollback if it fails to serve
      # (.github/update-gateway.sh). On a fresh instance user_data already installed exactly these
      # bytes at boot, so the script's SHA short-circuit makes this a no-op. This is the same in-place
      # mechanism the nightly node update uses; it keeps this deploy from ever recycling the box
      # (dig_ecosystem#2034).
      - name: install the gateway on the host in place
        env:
          TAG: ${{ vars.DIG_NODE_VERSION }}
          SHA: ${{ steps.art.outputs.sha }}
        run: |
          set -euo pipefail
          IID="$(terraform -chdir=infra output -raw node_instance_id)"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/rpc-gateway-aarch64"

          # Re-assert the shape at the boundary — last thing between a value and root execution on a
          # public-facing host.
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha: $SHA" >&2; exit 1; }
          [[ "$URL" =~ ^https://github\.com/DIG-Network/rpc\.dig\.net/releases/download/v[0-9.]+/rpc-gateway-aarch64$ ]] \
            || { echo "bad url: $URL" >&2; exit 1; }

          PRELUDE="$(printf 'export NEW_URL=%q NEW_SHA=%q' "$URL" "$SHA")"
          PARAMS="$(jq -Rs --arg prelude "$PRELUDE" '{commands: [$prelude, .]}' .github/update-gateway.sh)"
          .github/run-on-host.sh "$IID" "$PARAMS" 900

      # Prove it, do not assume it. A green apply is not a serving node.
      #
      # Verification runs ON the host over SSM, not by curling from this runner. That is not a
      # workaround for the security group — it is a consequence of it being right. The gateway port
      # is reachable only from CloudFront's origin ranges, so a runner that COULD curl it would mean
      # the group was wrong. There is no SSH either; SSM is the way in.
      - name: verify the node is actually serving
        run: |
          set -euo pipefail
          IID="$(terraform -chdir=infra output -raw node_instance_id)"
          echo "instance: $IID"

          for _ in $(seq 1 30); do
            PING="$(aws ssm describe-instance-information \
                      --filters "Key=InstanceIds,Values=$IID" \
                      --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)"
            [ "$PING" = "Online" ] && break
            sleep 10
          done
          [ "$PING" = "Online" ] || { echo "instance never came online in SSM" >&2; exit 1; }

          # Ship .github/verify-node.sh as a single RunShellScript command. jq -Rs does the quoting,
          # so the script stays a normal reviewable file instead of an escaped one-liner.
          PARAMS="$(jq -Rs '{commands: [.]}' .github/verify-node.sh)"
          CMD="$(aws ssm send-command --instance-ids "$IID" \
                  --document-name AWS-RunShellScript \
                  --parameters "$PARAMS" \
                  --query 'Command.CommandId' --output text)"

          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
                        --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in InProgress|Pending|Delayed) sleep 10 ;; *) break ;; esac
          done

          echo "--- on-host output ---"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
            --query 'StandardOutputContent' --output text || true
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
            --query 'StandardErrorContent' --output text >&2 || true

          [ "$STATUS" = "Success" ] || { echo "verification FAILED ($STATUS)" >&2; exit 1; }
          echo "node is serving; boundary verified on-host"
